<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreEase - Low Stock Alerts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3e 25%, #2d1b69 50%, #1e3a8a 75%, #0f172a 100%);
            position: relative;
            overflow-x: hidden;
        }
        
        /* Library Bookshelf Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><filter id="blur" x="-50%25" y="-50%25" width="200%25" height="200%25"><feGaussianBlur in="SourceGraphic" stdDeviation="8"/></filter></defs><g filter="url(%23blur)" opacity="0.15"><rect x="50" y="100" width="200" height="600" fill="%23654321"/><rect x="60" y="120" width="15" height="180" fill="%238B4513"/><rect x="80" y="120" width="12" height="160" fill="%23A0522D"/><rect x="95" y="120" width="18" height="200" fill="%23CD853F"/><rect x="118" y="120" width="14" height="170" fill="%23D2691E"/><rect x="137" y="120" width="16" height="190" fill="%23DEB887"/><rect x="158" y="120" width="11" height="150" fill="%23F4A460"/><rect x="174" y="120" width="13" height="180" fill="%23DAA520"/><rect x="192" y="120" width="15" height="165" fill="%23B8860B"/><rect x="212" y="120" width="12" height="175" fill="%23CD853F"/><rect x="229" y="120" width="16" height="155" fill="%23D2691E"/><rect x="60" y="320" width="14" height="160" fill="%23A0522D"/><rect x="79" y="320" width="17" height="180" fill="%23CD853F"/><rect x="101" y="320" width="13" height="170" fill="%23DEB887"/><rect x="119" y="320" width="15" height="190" fill="%23F4A460"/><rect x="139" y="320" width="12" height="150" fill="%23DAA520"/><rect x="156" y="320" width="18" height="175" fill="%23B8860B"/><rect x="179" y="320" width="14" height="165" fill="%23CD853F"/><rect x="198" y="320" width="16" height="185" fill="%23D2691E"/><rect x="219" y="320" width="11" height="155" fill="%23DEB887"/><rect x="60" y="520" width="16" height="160" fill="%23F4A460"/><rect x="81" y="520" width="13" height="180" fill="%23DAA520"/><rect x="99" y="520" width="15" height="170" fill="%23B8860B"/><rect x="119" y="520" width="12" height="190" fill="%23CD853F"/><rect x="136" y="520" width="17" height="150" fill="%23D2691E"/><rect x="158" y="520" width="14" height="175" fill="%23DEB887"/><rect x="177" y="520" width="16" height="165" fill="%23F4A460"/><rect x="198" y="520" width="11" height="185" fill="%23DAA520"/><rect x="214" y="520" width="18" height="155" fill="%23B8860B"/><rect x="350" y="100" width="200" height="600" fill="%23654321"/><rect x="360" y="120" width="14" height="170" fill="%238B4513"/><rect x="379" y="120" width="16" height="190" fill="%23A0522D"/><rect x="400" y="120" width="12" height="160" fill="%23CD853F"/><rect x="417" y="120" width="15" height="180" fill="%23D2691E"/><rect x="437" y="120" width="13" height="150" fill="%23DEB887"/><rect x="455" y="120" width="17" height="200" fill="%23F4A460"/><rect x="477" y="120" width="11" height="165" fill="%23DAA520"/><rect x="493" y="120" width="14" height="175" fill="%23B8860B"/><rect x="512" y="120" width="16" height="155" fill="%23CD853F"/><rect x="533" y="120" width="12" height="185" fill="%23D2691E"/></g></svg>');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -3;
        }
        
        /* Futuristic Overlay with Gradients and Glowing Effects */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 15% 25%, rgba(59, 130, 246, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(147, 51, 234, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.2) 0%, transparent 60%),
                radial-gradient(circle at 25% 75%, rgba(168, 85, 247, 0.25) 0%, transparent 35%),
                radial-gradient(circle at 75% 25%, rgba(34, 197, 94, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.6) 50%, rgba(15, 23, 42, 0.9) 100%);
            z-index: -2;
        }

        /* Static Wave Patterns */
        .wave-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs><linearGradient id="waveGrad1" x1="0%25" y1="0%25" x2="100%25" y2="100%25"><stop offset="0%25" style="stop-color:%233b82f6;stop-opacity:0.1" /><stop offset="100%25" style="stop-color:%239333ea;stop-opacity:0.05" /></linearGradient><linearGradient id="waveGrad2" x1="0%25" y1="0%25" x2="100%25" y2="100%25"><stop offset="0%25" style="stop-color:%2306b6d4;stop-opacity:0.08" /><stop offset="100%25" style="stop-color:%238b5cf6;stop-opacity:0.04" /></linearGradient></defs><path d="M0,400 Q300,300 600,400 T1200,400 L1200,800 L0,800 Z" fill="url(%23waveGrad1)"/><path d="M0,500 Q300,400 600,500 T1200,500 L1200,800 L0,800 Z" fill="url(%23waveGrad2)"/></svg>');
            background-size: 100% 100%;
            pointer-events: none;
            z-index: -1;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .header-logo {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-shadow: 0 0 15px rgba(102, 126, 234, 0.8);
        }

        .nav-menu {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-link {
            color: #e2e8f0;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            color: #ffffff;
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-1px);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .profile-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 16px;
            color: white;
        }

        .logout-btn {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }

        main {
            flex: 1;
            padding: 40px 20px;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-title {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 
                0 0 15px rgba(102, 126, 234, 0.9),
                0 0 25px rgba(102, 126, 234, 0.7),
                0 0 35px rgba(102, 126, 234, 0.5),
                2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .alerts-table-container {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .alerts-table {
            width: 100%;
            border-collapse: collapse;
        }

        .alerts-table th {
            background: rgba(30, 41, 59, 0.8);
            color: #e2e8f0;
            padding: 20px 15px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .alerts-table td {
            padding: 20px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 16px;
        }

        .alerts-table tr:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .item-name {
            font-weight: 600;
            color: #ffffff;
        }

        .current-quantity {
            color: #fbbf24;
            font-weight: 600;
        }

        .threshold {
            color: #94a3b8;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-right: 8px;
        }

        .btn-edit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-update {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-save {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-cancel {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-cancel:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        .edit-input, .update-input {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #ffffff;
            padding: 8px 12px;
            font-size: 14px;
            width: 80px;
            text-align: center;
        }

        .edit-input:focus, .update-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
        }

        .alert-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 20px;
        }

        .no-alerts {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
            font-size: 18px;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-container {
                padding: 0 15px;
                height: 65px;
            }

            .header-logo {
                font-size: 24px;
            }

            .nav-menu {
                display: none;
            }

            .page-title {
                font-size: 36px;
            }

            main {
                padding: 30px 15px;
            }

            .alerts-table-container {
                overflow-x: auto;
            }

            .alerts-table th,
            .alerts-table td {
                padding: 15px 10px;
                font-size: 14px;
            }

            .btn {
                padding: 6px 12px;
                font-size: 12px;
                margin-bottom: 4px;
            }

            .edit-input, .update-input {
                width: 60px;
                padding: 6px 8px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 28px;
            }

            .alerts-table th,
            .alerts-table td {
                padding: 10px 8px;
                font-size: 12px;
            }

            .alerts-table-container {
                border-radius: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="wave-pattern"></div>
    
    <div class="overlay">
        <header>
            <div class="header-container">
                <a href="#" class="header-logo">StoreEase</a>
                <nav class="nav-menu">
                    <a class="nav-link" href="#" onclick="goToDashboard()">Dashboard</a>
                    <a class="nav-link" href="#" onclick="goToInventory()">Inventory</a>
                    <a class="nav-link active" href="#" onclick="goToLowStock()">Low Stock</a>
                    <a class="nav-link" href="#" onclick="goToOrders()">Orders</a>
                </nav>
                <div class="user-profile">
                    <div class="profile-avatar">A</div>
                    <button class="logout-btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <main>
            <div class="main-container">
                <div class="page-header">
                    <h1 class="page-title">Low Stock Alerts ⚠️</h1>
                    <div class="alert-badge">Urgent Attention Required</div>
                </div>

                <div class="success-message" id="successMessage"></div>

                <div class="alerts-table-container">
                    <table class="alerts-table">
                        <thead>
                            <tr>
                                <th>Item Name</th>
                                <th>Current Quantity</th>
                                <th>Threshold</th>
                                <th>Edit Threshold</th>
                                <th>Update Stock</th>
                            </tr>
                        </thead>
                        <tbody id="alertsTableBody">
                            <!-- Sample low stock items -->
                            <tr data-item="lab-coat">
                                <td class="item-name">Lab Coat</td>
                                <td class="current-quantity" id="quantity-lab-coat">2</td>
                                <td class="threshold" id="threshold-lab-coat">5</td>
                                <td id="edit-cell-lab-coat">
                                    <button class="btn btn-edit" onclick="editThreshold('lab-coat')">Edit</button>
                                </td>
                                <td id="update-cell-lab-coat">
                                    <input type="number" class="update-input" id="update-input-lab-coat" min="0" placeholder="Add">
                                    <button class="btn btn-update" onclick="updateStock('lab-coat')">Update</button>
                                </td>
                            </tr>
                            <tr data-item="belt">
                                <td class="item-name">Belt</td>
                                <td class="current-quantity" id="quantity-belt">1</td>
                                <td class="threshold" id="threshold-belt">10</td>
                                <td id="edit-cell-belt">
                                    <button class="btn btn-edit" onclick="editThreshold('belt')">Edit</button>
                                </td>
                                <td id="update-cell-belt">
                                    <input type="number" class="update-input" id="update-input-belt" min="0" placeholder="Add">
                                    <button class="btn btn-update" onclick="updateStock('belt')">Update</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Item data storage
        let itemData = {
            'lab-coat': {
                name: 'Lab Coat',
                quantity: 2,
                threshold: 5
            },
            'belt': {
                name: 'Belt',
                quantity: 1,
                threshold: 10
            }
        };

        // Edit threshold functionality
        function editThreshold(itemId) {
            const editCell = document.getElementById(`edit-cell-${itemId}`);
            const currentThreshold = itemData[itemId].threshold;
            
            editCell.innerHTML = `
                <input type="number" class="edit-input" id="edit-input-${itemId}" value="${currentThreshold}" min="0">
                <button class="btn btn-save" onclick="saveThreshold('${itemId}')">Save</button>
                <button class="btn btn-cancel" onclick="cancelEditThreshold('${itemId}')">Cancel</button>
            `;
            
            // Focus on the input
            document.getElementById(`edit-input-${itemId}`).focus();
        }

        // Save threshold changes
        function saveThreshold(itemId) {
            const newThreshold = parseInt(document.getElementById(`edit-input-${itemId}`).value);
            
            if (isNaN(newThreshold) || newThreshold < 0) {
                alert('Please enter a valid threshold value (0 or greater)');
                return;
            }
            
            // Update the data
            itemData[itemId].threshold = newThreshold;
            
            // Update the display
            document.getElementById(`threshold-${itemId}`).textContent = newThreshold;
            
            // Restore the edit button
            const editCell = document.getElementById(`edit-cell-${itemId}`);
            editCell.innerHTML = `<button class="btn btn-edit" onclick="editThreshold('${itemId}')">Edit</button>`;
            
            // Show success message
            showSuccessMessage(`Threshold updated for ${itemData[itemId].name} to ${newThreshold}`);
        }

        // Cancel threshold editing
        function cancelEditThreshold(itemId) {
            const editCell = document.getElementById(`edit-cell-${itemId}`);
            editCell.innerHTML = `<button class="btn btn-edit" onclick="editThreshold('${itemId}')">Edit</button>`;
        }

        // Update stock functionality
        function updateStock(itemId) {
            const updateInput = document.getElementById(`update-input-${itemId}`);
            const addQuantity = parseInt(updateInput.value);
            
            if (isNaN(addQuantity) || addQuantity < 0) {
                alert('Please enter a valid quantity to add (0 or greater)');
                return;
            }
            
            // Update the data
            itemData[itemId].quantity += addQuantity;
            
            // Update the display
            document.getElementById(`quantity-${itemId}`).textContent = itemData[itemId].quantity;
            
            // Clear the input
            updateInput.value = '';
            
            // Show success message
            showSuccessMessage(`Stock updated for ${itemData[itemId].name}. Added ${addQuantity} units. New total: ${itemData[itemId].quantity}`);
            
            // Check if item should be removed from low stock alerts
            if (itemData[itemId].quantity >= itemData[itemId].threshold) {
                setTimeout(() => {
                    if (confirm(`${itemData[itemId].name} is no longer below threshold. Remove from low stock alerts?`)) {
                        document.querySelector(`tr[data-item="${itemId}"]`).remove();
                        checkIfNoAlertsRemaining();
                    }
                }, 2000);
            }
        }

        // Show success message
        function showSuccessMessage(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            // Hide after 3 seconds
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        // Check if no alerts remaining
        function checkIfNoAlertsRemaining() {
            const tableBody = document.getElementById('alertsTableBody');
            if (tableBody.children.length === 0) {
                document.querySelector('.alerts-table-container').innerHTML = `
                    <div class="no-alerts">
                        🎉 Great job! No items are currently below their stock threshold.
                    </div>
                `;
            }
        }

        // Navigation functions (placeholders for integration with main system)
        function goToDashboard() {
            alert('Navigate to Dashboard');
        }

        function goToInventory() {
            alert('Navigate to Inventory');
        }

        function goToLowStock() {
            // Already on this page
        }

        function goToOrders() {
            alert('Navigate to Orders');
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                alert('Logged out successfully');
            }
        }

        // Handle Enter key for inputs
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const target = e.target;
                
                // Handle edit threshold input
                if (target.classList.contains('edit-input')) {
                    const itemId = target.id.replace('edit-input-', '');
                    saveThreshold(itemId);
                }
                
                // Handle update stock input
                if (target.classList.contains('update-input')) {
                    const itemId = target.id.replace('update-input-', '');
                    updateStock(itemId);
                }
            }
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Low Stock Alerts page loaded');
        });
    </script>
</body>
</html>
