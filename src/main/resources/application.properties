# Application name
spring.application.name=storeease-backend

# JDBC Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/storeease
spring.datasource.username=storeuser
spring.datasource.password=store123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional: Log SQL queries executed by JdbcTemplate
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

# Connection pool settings (HikariCP is default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
